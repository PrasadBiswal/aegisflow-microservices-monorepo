name: CI - shipping-api

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'services/shipping-api/**'
      - 'tests/shipping-api.Tests/**'
      - 'libs/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'Dockerfile'
      - '.github/workflows/shipping-api.yml'
      - '.github/workflows/_ci-reusable.yml'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'services/shipping-api/**'
      - 'tests/shipping-api.Tests/**'
      - 'libs/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'Dockerfile'
      - '.github/workflows/shipping-api.yml'
      - '.github/workflows/_ci-reusable.yml'

jobs:
  ci:
    uses: ./.github/workflows/_ci-reusable.yml
    with:
      service-name: shipping-api
