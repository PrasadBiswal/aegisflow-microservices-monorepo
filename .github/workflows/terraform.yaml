name: Terraform Checks

on:
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/environments/dev/bootstrap
          - terraform/environments/dev/global/iam
          - terraform/environments/dev/us-east-1/networking
          - terraform/environments/dev/us-east-1/applications
          - terraform/environments/dev/us-east-1/data-stores
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: terraform
      - name: Validate (no AWS credentials needed)
        run: terraform init -backend=false && terraform validate
        working-directory: ${{ matrix.dir }}
