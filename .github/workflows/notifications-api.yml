name: CI - notifications-api

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'services/notifications-api/**'
      - 'tests/notifications-api.Tests/**'
      - 'libs/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'Dockerfile'
      - '.github/workflows/notifications-api.yml'
      - '.github/workflows/_ci-reusable.yml'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'services/notifications-api/**'
      - 'tests/notifications-api.Tests/**'
      - 'libs/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'Dockerfile'
      - '.github/workflows/notifications-api.yml'
      - '.github/workflows/_ci-reusable.yml'

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/_ci-reusable.yml
    with:
      service-name: notifications-api
