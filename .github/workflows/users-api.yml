name: CI - users-api

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'services/users-api/**'
      - 'tests/users-api.Tests/**'
      - 'libs/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'Dockerfile'
      - '.github/workflows/users-api.yml'
      - '.github/workflows/_ci-reusable.yml'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'services/users-api/**'
      - 'tests/users-api.Tests/**'
      - 'libs/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'Dockerfile'
      - '.github/workflows/users-api.yml'
      - '.github/workflows/_ci-reusable.yml'
permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/_ci-reusable.yml
    with:
      service-name: users-api
