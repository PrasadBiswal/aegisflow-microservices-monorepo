name: Reusable Microservice CI

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.service-name }}:${{ github.sha }}
      # Push to ECR only after a merge into dev, and only while a sandbox session is active.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (SDK from global.json + .NET 8 runtime for tests)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Unit tests
        run: dotnet test tests/${{ inputs.service-name }}.Tests --configuration Release

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE_NAME=${{ inputs.service-name }}
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}

      - name: Security scan (fails on fixable CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: AWS login (OIDC)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: ECR login
        id: ecr
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: env.PUSH == 'true'
        run: |
          TARGET=${{ steps.ecr.outputs.registry }}/${{ env.IMAGE }}
          docker tag $IMAGE $TARGET
          docker push $TARGET
