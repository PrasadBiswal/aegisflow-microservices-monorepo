# Local development stack: SQL Server + the 10 AegisFlow services.
#   Start:  docker compose up --build
#   Stop:   docker compose down        (add -v to also delete the database volume)
# For each service, <name>-migrate runs once (creates/updates its database), then <name> starts.
# Secrets come from .env (copy .env.example to .env and set DB_PASSWORD).

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Development
  DB_SERVER: sqlserver
  DB_USER: sa
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
  DB_TRUST_SERVER_CERTIFICATE: "true"   # local container uses a self-signed certificate

x-migrate: &migrate                     # one-off step: apply EF Core migrations, then exit
  command: ["migrate"]
  networks: [aegisflow-net]
  depends_on:
    sqlserver: { condition: service_healthy }

x-api: &api                             # long-running API container
  networks: [aegisflow-net]
  restart: unless-stopped

services:
  sqlserver:
    # 2019 = version 15.00, the same major version as the RDS module (dev/prod parity).
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: aegisflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      MSSQL_PID: Express
    ports:
      - "1433:1433"   # lets SSMS / Azure Data Studio on your laptop connect
    volumes:
      - mssql_data:/var/opt/mssql
    networks: [aegisflow-net]
    healthcheck:
      # Newer images have sqlcmd in mssql-tools18 (-C trusts the local certificate); older ones in mssql-tools.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------- users-api :8081 ----------
  users-api-migrate:
    <<: *migrate
    build: &users-build { context: ., args: { SERVICE_NAME: users-api } }
    image: aegisflow/users-api:local
    environment: { <<: *dotnet-env, DB_NAME: UsersDb }
  users-api:
    <<: *api
    build: *users-build
    image: aegisflow/users-api:local
    environment: { <<: *dotnet-env, DB_NAME: UsersDb }
    ports: ["8081:8080"]
    depends_on: { users-api-migrate: { condition: service_completed_successfully } }

  # ---------- catalog-api :8082 ----------
  catalog-api-migrate:
    <<: *migrate
    build: &catalog-build { context: ., args: { SERVICE_NAME: catalog-api } }
    image: aegisflow/catalog-api:local
    environment: { <<: *dotnet-env, DB_NAME: CatalogDb }
  catalog-api:
    <<: *api
    build: *catalog-build
    image: aegisflow/catalog-api:local
    environment: { <<: *dotnet-env, DB_NAME: CatalogDb }
    ports: ["8082:8080"]
    depends_on: { catalog-api-migrate: { condition: service_completed_successfully } }

  # ---------- inventory-api :8083 ----------
  inventory-api-migrate:
