# In-cluster SQL Server for the sandbox (option b). Data lives in an emptyDir, so it is lost when the
# pod restarts - fine for a 2-hour sandbox; use RDS (enable_rds = true) for anything real.
# The password comes from the Secret "aegisflow-db-secret", created by the runbook (never stored in Git).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  labels:
    app.kubernetes.io/name: sqlserver
    app.kubernetes.io/part-of: aegisflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sqlserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sqlserver
        app.kubernetes.io/part-of: aegisflow
    spec:
      securityContext:
        fsGroup: 10001                   # the image's "mssql" user
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2019-latest
          ports:
            - name: tds
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Express
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegisflow-db-secret
                  key: password
          readinessProbe:
            tcpSocket:
              port: tds
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  labels:
    app.kubernetes.io/name: sqlserver
spec:
  selector:
    app.kubernetes.io/name: sqlserver
  ports:
    - name: tds
      port: 1433
      targetPort: tds
