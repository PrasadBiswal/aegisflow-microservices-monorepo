# Defaults for every service. ArgoCD (gitops/argocd/services-appset.yaml) sets the per-service values.

replicaCount: 1

image:
  repository: ""            # required: <account>.dkr.ecr.us-east-1.amazonaws.com/<service>
  tag: ""                   # git SHA pushed by CI (defaults to appVersion)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

database:
  server: sqlserver         # in-cluster SQL Server Service (or the RDS address when enable_rds = true)
  name: ""                  # required: UsersDb, CatalogDb, ...
  user: sa
  trustServerCertificate: "true"   # in-cluster SQL Server uses a self-signed certificate
  passwordSecret:
    name: aegisflow-db-secret
    key: password

# Runs "<service> migrate" as a Job before every deploy (ArgoCD PreSync hook).
migrations:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi
